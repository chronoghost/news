name: Refresh Chronoghost News digest

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 BST (05:00 GMT in winter)
    - cron: "0 17 * * *"  # 18:00 BST (17:00 GMT in winter)
  workflow_dispatch:
  push:
    branches: [main]      # your own pushes redeploy as-is (no rebuild); bot pushes never re-trigger

permissions:
  contents: write   # commit the refreshed index.html
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build digest
        if: github.event_name != 'push'
        run: python3 scripts/build_news.py index.html

      - name: Commit and push if changed
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to index.html"; exit 0
          fi
          day=$(TZ=Europe/London date '+%-d %b %Y')
          if [ "$(TZ=Europe/London date +%H)" -lt 12 ]; then half=morning; else half=afternoon; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Chronoghost News digest (${day} ${half})"
          git pull --rebase origin main
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not trigger a branch-based Pages build,
      # so the site is deployed explicitly from this workflow.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
